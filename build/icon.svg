<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Editable source for both app icon PNGs; electron-builder generates
       .ico / .icns from them. Regenerate with `npm run icons` (renders this
       file twice through Electron). Opening this file directly previews the
       Windows variant.

         build/icon.png      Windows: the rounded tile is baked in, because
                             Windows draws the bitmap as-is.
         build/icon-mac.png  macOS: full bleed and fully opaque, because
                             macOS draws the shape itself.

       The macOS variant is NOT cosmetic. macOS 26 (Tahoe) inspects the
       outermost pixels of the icon: alpha >= 253 gets clipped to the system
       squircle, alpha <= 252 gets scaled down and inset into a light grey
       rounded plate ("squircle jail") — a white-ish frame around the icon.
       A baked-in rounded tile has transparent corners, so it always loses.
       Hence: no rounded corners, no bevel and no transparent margin on the
       macOS variant, and the renderer forces every alpha byte to 255.
       Keep artwork clear of the corners; the system mask cuts them at a
       larger radius (~230px at 1024) than the tile below uses. -->

  <style>
    /* The renderer sets class="mac" on the root to pick the macOS variant. */
    .mac-only { display: none; }
    svg.mac .mac-only { display: block; }
    svg.mac .win-only { display: none; }
  </style>

  <defs>
    <!-- Background depth: lighter at the top, darker toward the bottom. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c212b"/>
      <stop offset="0.55" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <!-- Raised bevel on the border: bright at the top edge, dark at the bottom. -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6472"/>
      <stop offset="0.5" stop-color="#39414d"/>
      <stop offset="1" stop-color="#232932"/>
    </linearGradient>
    <!-- Spherical shading for the end dots (works on any circle via bounding-box units). -->
    <radialGradient id="dotGloss" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <!-- Soft top sheen across the upper half of the tile. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow used to lift the lines, dots and wordmark off the tile. -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background, Windows: dark rounded square with a beveled border, leaving
       a transparent margin so the tile is not flush with the canvas edge. -->
  <g class="win-only">
    <rect x="26" y="26" width="972" height="972" rx="104" ry="104" fill="url(#bg)"/>
    <rect x="30" y="30" width="964" height="964" rx="100" ry="100" fill="url(#sheen)"/>
    <rect x="26" y="26" width="972" height="972" rx="104" ry="104" fill="none" stroke="url(#bevel)" stroke-width="14"/>
  </g>

  <!-- Background, macOS: edge-to-edge and opaque, no corners and no bevel —
       macOS applies its own squircle mask and drop shadow on top. -->
  <g class="mac-only">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
  </g>

  <!-- Signal lines framing the wordmark: a crossing pair on top, another on the
       bottom. Each line is a dark casing under a bright core plus a thin upper
       highlight, giving a rounded-tube look. The whole group is lifted with a
       soft shadow. Same routing motif as the app. -->
  <g filter="url(#lift)" stroke-linecap="round" fill="none">
    <!-- casings (shadow side), shifted slightly down -->
    <g transform="translate(0,4)">
      <path d="M 168 206 C 380 206 644 322 856 322" stroke="#123c1c" stroke-width="36"/>
      <path d="M 168 322 C 380 322 644 206 856 206" stroke="#123049" stroke-width="36"/>
      <path d="M 168 702 C 380 702 644 818 856 818" stroke="#50360b" stroke-width="36"/>
      <path d="M 168 818 C 380 818 644 702 856 702" stroke="#432e5c" stroke-width="36"/>
    </g>
    <!-- bright cores -->
    <path d="M 168 206 C 380 206 644 322 856 322" stroke="#37c24d" stroke-width="18"/>
    <path d="M 168 322 C 380 322 644 206 856 206" stroke="#4aa3f0" stroke-width="18"/>
    <path d="M 168 702 C 380 702 644 818 856 818" stroke="#d99a20" stroke-width="18"/>
    <path d="M 168 818 C 380 818 644 702 856 702" stroke="#c98bfa" stroke-width="18"/>
    <!-- upper highlights (lighter tint), shifted up to catch the light -->
    <g transform="translate(0,-4)" stroke-width="6" stroke-opacity="0.9">
      <path d="M 168 206 C 380 206 644 322 856 322" stroke="#8fe89f"/>
      <path d="M 168 322 C 380 322 644 206 856 206" stroke="#a9d3f8"/>
      <path d="M 168 702 C 380 702 644 818 856 818" stroke="#f2c96f"/>
      <path d="M 168 818 C 380 818 644 702 856 702" stroke="#e2bcfd"/>
    </g>
  </g>

  <!-- End dots: base color + spherical gloss overlay -->
  <g filter="url(#lift)">
    <g>
      <circle cx="168" cy="206" r="24" fill="#37c24d"/>
      <circle cx="856" cy="322" r="24" fill="#37c24d"/>
      <circle cx="168" cy="322" r="24" fill="#4aa3f0"/>
      <circle cx="856" cy="206" r="24" fill="#4aa3f0"/>
      <circle cx="168" cy="702" r="24" fill="#d99a20"/>
      <circle cx="856" cy="818" r="24" fill="#d99a20"/>
      <circle cx="168" cy="818" r="24" fill="#c98bfa"/>
      <circle cx="856" cy="702" r="24" fill="#c98bfa"/>
    </g>
    <g fill="url(#dotGloss)">
      <circle cx="168" cy="206" r="24"/>
      <circle cx="856" cy="322" r="24"/>
      <circle cx="168" cy="322" r="24"/>
      <circle cx="856" cy="206" r="24"/>
      <circle cx="168" cy="702" r="24"/>
      <circle cx="856" cy="818" r="24"/>
      <circle cx="168" cy="818" r="24"/>
      <circle cx="856" cy="702" r="24"/>
    </g>
  </g>

  <!-- Wordmark: big, centered, embossed. A dark copy (down-right) and a light
       copy (up-left) sit behind the main fill to create raised edges; a soft
       shadow lifts the whole thing. -->
  <g filter="url(#lift)"
     font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800"
     font-size="270" letter-spacing="4" text-anchor="middle" dominant-baseline="central">
    <text x="516" y="517" fill="#05070a" fill-opacity="0.85">USPV</text>
    <text x="509" y="508" fill="#ffffff" fill-opacity="0.30">USPV</text>
    <text x="512" y="512" fill="#dfe5ec">USPV</text>
  </g>
</svg>
