# Builds the Electron app for Windows (NSIS installer) and macOS
# (universal dmg, unsigned) on every v* tag push and attaches the
# artifacts to a DRAFT GitHub Release. Publish the release manually
# after checking the artifacts.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build bundle
        run: npm run check

      # electron-builder uploads to a draft release for the pushed tag.
      # macOS builds are unsigned (no certs configured); electron-builder
      # applies the ad-hoc signature required on Apple Silicon.
      - name: Package and upload to draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly disable code signing on macOS runners
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
